name: Test
on:
  push:
    branches:
    - master
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go-version: [ 1.26.x, 1.27.x ]
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - run: go version
    - run: go test -shuffle=on ./...
    - run: go test -race -shuffle=on ./...
